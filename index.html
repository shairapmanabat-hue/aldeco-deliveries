<style>
:root{
  --cream:#F5F5F4; --cream2:#ECECEB; --card:#FFFFFF; --ink:#1C1C1C; --muted:#6A6A6A; --line:#DCDCDA;
  --orange:#1C1C1C; --red:#1C1C1C; --grad:#1C1C1C;
  --s-requested:#8C8C8C; --s-proposed:#5C5C5C; --s-confirmed:#2E2E2E; --s-loaded:#474747; --s-out:#2E2E2E; --s-delivered:#1C1C1C; --s-cancelled:#B5B5B5;
  --radius:6px; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#1C1C1C;text-decoration:underline}
.top{position:sticky;top:0;z-index:20;background:#FFFFFF;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:6px;background:#FEFFF1;border:1px solid var(--line);object-fit:cover;display:block}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px;background:var(--cream2);padding:4px;border-radius:6px}
nav a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
nav a.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#d8c7ad}
.btn.primary{background:#1C1C1C;border-color:#1C1C1C;color:#fff}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:#1C1C1C;text-decoration:underline}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1280px;margin:0 auto;padding:16px}
.banner{max-width:1280px;margin:10px auto 0;padding:10px 14px;border-radius:5px;background:#F0F0EF;border:1px solid #D0D0CE;color:#1C1C1C;display:none}
.banner.show{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.kpi.warn b{color:#1C1C1C}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px;max-width:360px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(0,0,0,.12);border-color:#1C1C1C}
textarea{min-height:70px;resize:vertical}
.cols{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--cream2);border-radius:var(--radius);padding:8px;min-height:120px}
.colh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:4px 6px 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.colh .n{margin-left:auto;background:#fff;border-radius:4px;padding:1px 8px;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);border-left:4px solid var(--sc,#ccc)}
.card:hover{border-color:#d8c7ad}
.card .t{font-weight:700}
.card .m{color:var(--muted);font-size:12px;margin-top:2px}
.card .d{font-weight:600;font-size:12px;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--cream2);color:var(--ink)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px;color:#fff;background:var(--sc)}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 6px}
/* calendar */
.calwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table.cal{border-collapse:collapse;width:100%;min-width:980px;table-layout:fixed}
.cal th,.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:8px}
.cal th{background:var(--cream);font-size:12px;text-align:left;font-weight:700}
.cal th.today{background:#E4E4E2}
.cal th .big{font-size:18px;font-weight:800;display:block}
.cal td.rowh{background:var(--cream);font-weight:700;width:130px}
.cal td.rowh small{display:block;color:var(--muted);font-weight:500}
.cal td.over{background:#EFEFEE}
.cap{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.cap.full{color:#1C1C1C;text-decoration:underline}
.mini{font-size:12px;border-radius:8px;padding:5px 7px;margin-bottom:5px;cursor:pointer;background:var(--cream);border-left:3px solid var(--sc)}
.mini b{display:block;font-size:12px}
.month{background:#fff;border:1px solid var(--line);border-radius:6px;margin-top:22px;overflow-x:auto}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mhead h3{margin:0 8px 0 0;font-size:16px}
table.mcal{border-collapse:collapse;width:100%;min-width:860px;table-layout:fixed}
.mcal th{background:var(--cream);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.mcal td{height:118px;vertical-align:top;padding:6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer}
.mcal td:hover{background:#FAFAF9}
.mcal td.other{background:#F8F8F7;color:#B0B0AE}
.mcal td.today{box-shadow:inset 0 0 0 2px #1C1C1C}
.mcal .dn{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mcal .dn small{font-weight:600;font-size:11px;color:var(--muted)}
.mcal .it{font-size:11.5px;line-height:1.3;padding:3px 5px;margin-bottom:3px;border-left:3px solid var(--sc);background:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
/* ---- Login + connection to the Aldeco Deliveries Google Sheet (via Apps Script) ---- */
var ALDECO_API = 'https://script.google.com/macros/s/AKfycbwJlrrAoaWLxRU8VgcgKAkXRw3ahp6T499y4LH9yH2OD7Jw9zupcMPFZqDZjmavRqOV/exec';
(function(){
  var LS='aldecoLogin';
  function getLogin(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
  function setLogin(v){ try{ if(v) localStorage.setItem(LS,JSON.stringify(v)); else localStorage.removeItem(LS); }catch(e){} }
  function slug(n){ return 'n-'+String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var login=getLogin();
  var isInstallerPage=/installer(\.html)?$/.test(location.pathname);
  if(login){
    try{ localStorage.setItem('aldecoUid',slug(login.name)); }catch(e){}
    if(login.role==='installer' && !isInstallerPage){ location.replace('installer.html'); }
  }
  window.aldecoLogin={ get:function(){ return login; }, logout:function(){ setLogin(null); try{ localStorage.removeItem('aldecoUid'); }catch(e){} location.reload(); } };
  function post(body){ return fetch(ALDECO_API,{method:'POST',body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }
  var waiters=[];
  function ready(){ return login?Promise.resolve(login):new Promise(function(r){ waiters.push(r); }); }
  function callApi(fn,args){
    if(fn==='api_url') return Promise.resolve(location.origin+location.pathname);
    return ready().then(function(l){ return post({fn:fn,args:args,user:l.name,pin:l.pin}); }).then(function(j){
      if(!j.ok){ if(j.error==='LOGIN'){ setLogin(null); location.reload(); } throw new Error(j.error||'Server error'); }
      return j.result; });
  }
  function runner(ok,fail){
    return new Proxy({},{get:function(_,k){
      if(k==='withSuccessHandler') return function(f){ return runner(f,fail); };
      if(k==='withFailureHandler') return function(f){ return runner(ok,f); };
      return function(){ var a=[].slice.call(arguments); callApi(k,a).then(function(r){ ok&&ok(r); },function(e){ fail&&fail(e); }); };
    }});
  }
  var params={}; new URLSearchParams(location.search).forEach(function(v,k){ params[k]=v; });
  if(isInstallerPage) params.app='installer';
  window.google={script:{run:runner(null,null),url:{getLocation:function(cb){ setTimeout(function(){ cb({parameter:params,hash:location.hash.slice(1)}); },0); }}}};

  function showLogin(){
    var st=document.createElement('style');
    st.textContent='#lg{position:fixed;inset:0;z-index:300;background:#F5F5F4;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Plus Jakarta Sans",system-ui,sans-serif}'+
      '#lg .bx{background:#fff;border:1px solid #DCDCDA;border-radius:10px;padding:28px 24px;width:min(380px,100%)}'+
      '#lg img{width:56px;height:56px;border-radius:8px;display:block;margin:0 auto 10px}'+
      '#lg h1{font-size:20px;text-align:center;margin:0 0 4px}#lg p{color:#6A6A6A;text-align:center;margin:0 0 20px;font-size:14px}'+
      '#lg label{display:block;font-size:12px;font-weight:700;color:#6A6A6A;margin:0 0 4px}'+
      '#lg input{width:100%;box-sizing:border-box;border:1px solid #DCDCDA;border-radius:6px;padding:12px;font-size:16px;margin-bottom:14px;font-family:inherit}'+
      '#lg button{width:100%;background:#1C1C1C;color:#fff;border:0;border-radius:8px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}'+
      '#lg .er{color:#1C1C1C;font-weight:700;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}';

<script>
/* ---- Google Sheets connection (replaces the Claude page database) ---- */
(function(){
  var cache={deliveries:{},store:{}}, lastJson='', loaded=false;
  var colL={}, docL={};
  var meta={fromCache:false,hasPendingWrites:false};
  function split(p){ return String(p).split('/'); }
  function getDoc(path){ var p=split(path); if(p[0]==='deliveries'&&p.length===2) return cache.deliveries[p[1]]; return cache.store[path]; }
  function setLocal(path,data){ var p=split(path); if(p[0]==='deliveries'&&p.length===2){ if(data) cache.deliveries[p[1]]=data; else delete cache.deliveries[p[1]]; } else { if(data) cache.store[path]=data; else delete cache.store[path]; } }
  function collDocs(col){
    if(col==='deliveries') return Object.keys(cache.deliveries).map(function(id){return {id:id,d:cache.deliveries[id]};});
    var pre=col+'/'; return Object.keys(cache.store).filter(function(p){return p.indexOf(pre)===0&&p.slice(pre.length).indexOf('/')<0;}).map(function(p){return {id:p.slice(pre.length),d:cache.store[p]};});
  }
  function docSnap(path){ var d=getDoc(path); return {id:split(path).pop(),exists:!!d,data:function(){return d;},metadata:meta}; }
  function colSnap(col){ var docs=collDocs(col).map(function(x){return {id:x.id,exists:true,data:function(){return x.d;},metadata:meta};}); return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return [];},metadata:meta}; }
  function emit(){ Object.keys(colL).forEach(function(c){ var s=colSnap(c); colL[c].forEach(function(f){ try{f(s);}catch(e){console.error(e);} }); });
                   Object.keys(docL).forEach(function(p){ var s=docSnap(p); docL[p].forEach(function(f){ try{f(s);}catch(e){console.error(e);} }); }); }
  var polling=false;
  function poll(){ if(polling) return; polling=true;
    google.script.run.withSuccessHandler(function(r){ polling=false; var j=JSON.stringify(r); loaded=true; if(j!==lastJson){ lastJson=j; cache=JSON.parse(j); emit(); } })
      .withFailureHandler(function(){ polling=false; }).api_getAll(); }
  poll(); setInterval(function(){ if(!document.hidden) poll(); },8000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) poll(); });
  function call(fn){ var args=[].slice.call(arguments,1); return new Promise(function(res,rej){ var r=google.script.run.withSuccessHandler(function(v){ res(v); setTimeout(poll,800); }).withFailureHandler(function(e){ rej({code:'unavailable',message:String(e&&e.message||e)}); setTimeout(poll,300); }); r[fn].apply(r,args); }); }
  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  function merge(a,b){ var o={}; Object.keys(a||{}).forEach(function(k){o[k]=a[k];}); Object.keys(b||{}).forEach(function(k){ var v=b[k]; if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])) o[k]=merge(o[k],v); else o[k]=v; }); return o; }
  function newId(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function docRef(path){ return {
    id:split(path).pop(), path:path,
    get:function(){ return Promise.resolve(docSnap(path)); },
    set:function(data){ var d=clone(data); setLocal(path,d); emit(); return call('api_set',path,JSON.stringify(d)); },
    update:function(data){ var cur=getDoc(path); if(!cur) return Promise.reject({code:'invalid_argument',message:'missing'}); var d=clone(data); setLocal(path,merge(cur,d)); emit(); return call('api_update',path,JSON.stringify(d)); },
    delete:function(){ setLocal(path,null); emit(); return call('api_delete',path); },
    acquire:function(){ return Promise.resolve({acquired:true}); },
    onSnapshot:function(f){ (docL[path]=docL[path]||[]).push(f); if(loaded) setTimeout(function(){ f(docSnap(path)); },0); return function(){ docL[path]=(docL[path]||[]).filter(function(x){return x!==f;}); }; },
    collection:function(sub){ return colRef(path+'/'+sub); } }; }
  function colRef(col){ var q={
    path:col,
    doc:function(id){ return docRef(col+'/'+(id||newId())); },
    add:function(d){ var r=docRef(col+'/'+newId()); return r.set(d).then(function(){return r;}); },
    where:function(){return q;}, orderBy:function(){return q;}, limit:function(){return q;},
    get:function(){ return Promise.resolve(colSnap(col)); },
    onSnapshot:function(f){ (colL[col]=colL[col]||[]).push(f); if(loaded) setTimeout(function(){ f(colSnap(col)); },0); return function(){ colL[col]=(colL[col]||[]).filter(function(x){return x!==f;}); }; } }; return q; }
  var db={doc:docRef,collection:colRef};
  var uid; try{ uid=localStorage.getItem('aldecoUid'); }catch(e){}
  if(!uid){ uid='u'+Math.random().toString(36).slice(2,10); try{ localStorage.setItem('aldecoUid',uid); }catch(e){} }
  var user={ id:function(){return Promise.resolve(uid);}, me:function(){return Promise.resolve({id:uid});},
    isOwner:function(){return Promise.resolve(false);}, canEdit:function(){return Promise.resolve(true);}, can:function(){return Promise.resolve(true);},
    profiles:function(ids){ var o={}; (ids||[]).forEach(function(i){ var m=cache.store['members/'+i]; o[i]={name:(m&&m.name)||(/^n-/.test(i)?i.slice(2).split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' '):'')}; }); return Promise.resolve(o); } };
  window.claude={ use:function(n){ return Promise.resolve(n==='db'?db:n==='user'?user:null); } };
  // open the Installer app when the link has ?app=installer
  try{ google.script.url.getLocation(function(loc){ var a=loc&&loc.parameter&&loc.parameter.app; if(a==='installer'&&!/installer/.test(location.hash)) location.hash='installer'; }); }catch(e){}
})();
</script>
<script>
/* ---------- constants ---------- */
const STATUS = {
  requested:{label:'Not scheduled',  short:'Not scheduled',        color:'var(--s-requested)'},
  proposed: {label:'Waiting on Sales', short:'New date proposed', color:'var(--s-proposed)'},
  confirmed:{label:'Confirmed',     short:'Confirmed',        color:'var(--s-confirmed)'},
  loaded:   {label:'Loaded',        short:'Loaded',           color:'var(--s-loaded)'},
  out:      {label:'Out for delivery', short:'Out for delivery', color:'var(--s-out)'},
  delivered:{label:'Delivered',     short:'Delivered',        color:'var(--s-delivered)'},
  cancelled:{label:'Cancelled',     short:'Cancelled',        color:'var(--s-cancelled)'},
};
const BOARD_COLS = ['requested','proposed','confirmed','loaded','out','delivered'];
const SCHEDULED = ['confirmed','loaded','out','delivered'];
const WINDOWS = {am:'Morning (8AM–12NN)', pm:'Afternoon (1PM–5PM)', day:'Whole day'};

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node?c:String(c)); }
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='selected') el[k]=v;
    else el.setAttribute(k, v===true?'':v);
  }
  if(tag==='a'){ const hr=el.getAttribute('href')||''; if(/^tel:/i.test(hr)) el.setAttribute('target','_top'); }
  return el;
}
function pad(n){return String(n).padStart(2,'0')}
function dstr(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
function todayStr(){return dstr(new Date())}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)}
function mondayOf(s){const d=parseD(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d)}
function fmtD(s,opt){ if(!s) return '—'; return parseD(s).toLocaleDateString('en-PH',opt||{weekday:'short',month:'short',day:'numeric'}) }
function fmtLong(s){return fmtD(s,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function fmtTime(ms){ if(!ms) return ''; const d=new Date(ms); return d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}) }
function nameOf(id){ if(!id) return 'Someone'; if(id===me.id) return (names[id]||'You'); return names[id]||'Someone' }
function truckName(id){ const t=(config.trucks||[]).find(t=>t.id===id); return t?t.name:(id?'Removed driver':'No driver yet') }
function sc(st){return (STATUS[st]||STATUS.requested).color}
function role(){ return mode==='sales'?'sales':mode==='installer'?'delivery':(isOwnerViewer?'owner':me.role) }
function isSales(){const r=role();return r==='sales'||r==='owner'}
function isDelivery(){const r=role();return r==='delivery'||r==='owner'}
function mapsUrl(d){ if(d.mapLink && /^https?:\/\//i.test(d.mapLink)) return d.mapLink; return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.address||'') }
function telHref(p){return 'tel:'+String(p||'').replace(/[^\d+]/g,'')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function banner(msg){const b=document.getElementById('banner');if(msg){b.textContent=msg;b.classList.add('show')}else b.classList.remove('show')}
function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return "This couldn't be saved. Please try again.";
  if(c==='quota_exceeded') return 'The delivery database is full. Delete old cancelled requests to make room.';
  if(c==='resource_exhausted') return 'Too many saves at once. Wait a few seconds and try again.';
  return 'Could not save right now. Check your internet and try again.';
}
function bookedCount(date,truckId,excludeId){
  return deliveries.filter(d=>d.id!==excludeId && d.date===date && (d.truckId||'')===(truckId||'') && SCHEDULED.includes(d.status)).length;
}
function capOf(truckId){ const t=(config.trucks||[]).find(t=>t.id===truckId); return t?Number(t.cap)||0:0 }
function custMessage(d){
  return `Good day, ${d.customer}! This is Aldeco Furniture. Your order${d.soNo?' ('+d.soNo+')':''} is scheduled for delivery on ${fmtLong(d.date)}, ${WINDOWS[d.window]||''}. Please reply to confirm if this schedule works for you. Thank you!`;
}

/* ---------- data writes ---------- */
async function patchDelivery(d0, patch, text){
  const d=deliveries.find(x=>x.id===d0.id)||d0;
  const hist=[...(d.history||[]), {at:Date.now(), by:me.id, text}].slice(-80);
  await db.doc('deliveries/'+d.id).update({...patch, history:hist, updatedAt:Date.now(), updatedBy:me.id});
}

/* ---------- init ---------- */
(async()=>{
  readHash(); render();
  const timer=setTimeout(()=>banner("Can't reach the shared delivery data yet. Check your internet — it will load by itself once connected."),10000);
  let u=null;
  try{ [db,u]=await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){}
  user=u;
  if(!db){ clearTimeout(timer); banner('Could not connect to the Google Sheet.'); render(); return; }
  try{ me.id = user ? await user.id() : null; }catch(e){}
  try{ isOwnerViewer = user ? !!(await user.isOwner()) : false; }catch(e){}
  try{ const cw = user ? await user.can('data.write') : null; if(cw===false) canWrite=false; }catch(e){}
  if(!canWrite) banner("You have view-only access. Ask Shaira to share this page with you as a Contributor so you can make changes.");
  const fail=e=>{clearTimeout(timer); if(e&&e.code!=='revoked') banner('Lost connection to the shared data. Reload the page to reconnect.')};
  const settle=(meta)=>{ if(!meta.fromCache){clearTimeout(timer); if(canWrite) banner(null)} };
  db.collection('deliveries').onSnapshot(s=>{ settle(s.metadata); deliveries=s.docs.map(x=>({id:x.id,...x.data()})); loaded.d=true; refreshNames(); render(); }, fail);
  db.doc('settings/config').onSnapshot(s=>{ config=s.exists?{trucks:[],...s.data()}:{trucks:[]}; loaded.c=true; render(); }, fail);
  db.collection('members').onSnapshot(s=>{
    members={}; s.docs.forEach(x=>members[x.id]=x.data());
    me.role = (me.id && members[me.id] && members[me.id].role) || (isOwnerViewer?'owner':null);
    loaded.m=true; refreshNames(); ensureMember(); routeByRole(); render(); maybeAskRole();
  }, fail);
})();

async function refreshNames(){
  if(!user || !user.profiles) return;
  const ids=new Set(Object.keys(members));
  if(me.id) ids.add(me.id);
  deliveries.forEach(d=>{ if(d.createdBy) ids.add(d.createdBy); (d.history||[]).forEach(x=>x.by&&ids.add(x.by)); });
  const missing=[...ids].filter(id=>!(id in names));
  if(!missing.length) return;
  missing.forEach(id=>names[id]=names[id]||'');
  try{ const ps=await user.profiles(missing); let ch=false; for(const id of missing){ const n=ps&&ps[id]&&ps[id].name; if(n){names[id]=n;ch=true} } if(ch) render(); }catch(e){}
}

/* ---------- routing ---------- */
function readHash(){
  const v=(location.hash||'').replace('#','');
  const pick=(m,def)=>{ mode=m; const keys=APPS[m].tabs.map(t=>t[0]); view=keys.includes(v)?v:def; };
  if(v==='sales-list'||v==='sales-home'){ mode='sales'; view='sales'; }
  else if(v==='sales'||v.startsWith('sales-')) pick('sales','sales');
  else if(v==='installer'||v.startsWith('installer-')){ mode='installer'; view='installer'; }
  else pick('sales','sales');
  if(mode==='installer' && view==='installer') routeDate=routeDate||todayStr();
}
window.addEventListener('hashchange',()=>{readHash();closeDrawer();render()});
readHash();
document.getElementById('newBtn').addEventListener('click',()=>requestForm());
document.getElementById('installBtn').addEventListener('click',()=>installGuide());

  const ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);

  const iosSteps=h('div',null,h('h4',{style:'margin:6px 0'},'iPhone (Safari)'),
    step(1,'Open the app link below in Safari.'),
    step(2,['Tap the ',h('b',null,'Share'),' button (square with an arrow) at the bottom.']),
    step(3,['Scroll down and tap ',h('b',null,'Add to Home Screen'),', then ',h('b',null,'Add'),'.']));
  const andSteps=h('div',null,h('h4',{style:'margin:6px 0'},'Android (Chrome)'),
    step(1,'Open the app link below in Chrome.'),
    step(2,['Tap the ',h('b',null,'⋮'),' menu at the top right.']),
    step(3,['Tap ',h('b',null,'Add to Home screen'),' (or ',h('b',null,'Install app'),'), then ',h('b',null,'Add'),'.']));
  const linkBox=h('input',{value:url,readonly:true,style:'margin-top:4px'});
  const copy=h('button',{class:'btn primary',style:'width:100%;margin-top:8px',onclick:async()=>{ try{ await navigator.clipboard.writeText(url); toast('Link copied — paste it in Safari or Chrome'); }catch(e){ linkBox.select(); toast('Select the link and copy it'); } }},'Copy app link');
  modal({title:'Install on this phone',cancelLabel:'Close',body:h('div',null,
    h('div',{class:'infobox'},'This puts an ',h('b',null,(mode==='installer'?'Aldeco Installer':'Aldeco Sales')),' icon on your home screen so you can open it in one tap, like an app.'),

    h('div',{class:'field',style:'margin-top:12px'},h('label',null,'App link'),linkBox),copy)});

document.getElementById('roleChip').addEventListener('click',()=>{ const L=window.aldecoLogin&&aldecoLogin.get(); if(!L) return; modal({title:'Log out?',body:h('div',{class:'infobox'},'Signed in as ',h('b',null,L.name),'. Log out of this phone?'),saveLabel:'Log out',kind:'dark',onSave:()=>{ aldecoLogin.logout(); return false; }}); });

let memberWriting=false;
async function ensureMember(){
  // Opening the Sales or Installer app registers the person on that team the first time.
  if(mode==='full'||memberWriting||!db||!me.id||!canWrite||members[me.id]) return;
  memberWriting=true;
  try{ await db.doc('members/'+me.id).set({role:mode==='sales'?'sales':'delivery',joinedAt:Date.now()}); }catch(e){}
  memberWriting=false;
}
function routeByRole(){
  // Non-owners who open the plain link are sent to their own app.
  const v=(location.hash||'').replace('#','');
  if(v||isOwnerViewer||!me.role) return;
  if(me.role==='delivery') location.hash='installer';
}
document.getElementById('scrim').addEventListener('click',closeDrawer);

/* ---------- render ---------- */
function render(){
  const app=APPS[mode];
  document.getElementById('appTitle').textContent=app.title;
  document.getElementById('appSub').textContent=app.sub;
  document.title=app.title;
  const navEl=document.getElementById('nav'); navEl.style.display=app.tabs.length?'':'none';
  navEl.replaceChildren(...app.tabs.map(([k,l])=>h('a',{href:'#'+k,class:view===k?'on':''},l)));
  document.body.classList.toggle('inst',mode==='installer');
  const chip=document.getElementById('roleChip');
  const r=role();
  chip.textContent = r ? ((names[me.id]||'You')+' · '+ROLES[r]) : (db?'Pick your team':'Not signed in');
  const nb=document.getElementById('newBtn');
  nb.style.display = (isSales()&&canWrite&&mode!=='installer')?'':'none';
  nb.textContent = mode==='sales' ? '+ New request' : '+ New delivery request';
  const main=document.getElementById('main');
  if(view!=='installer'){ const gb=document.getElementById('gbar'); if(gb) gb.remove(); }
  if(gridFocused()){ gridPending=true; if(openId) renderDrawer(); return; }
  main.replaceChildren();
  if(!loaded.d && db){ main.append(h('div',{class:'empty',style:'padding:40px'},'Loading deliveries…')); }
  else if(view==='board') main.append(renderBoard());
  else if(view==='calendar'||view==='sales-calendar'||view==='installer-week') main.append(renderCalendar());
  else if(view==='installer') main.append(renderInstaller());
  else if(view==='route') main.append(renderRoute());
  else if(view==='team') main.append(trucksPanel());
  else if(view==='list'||view==='sales'||view==='installer-list') main.append(renderTable());
  else if(view==='sales-home') main.append(renderSalesHome());
  else if(view==='installer-queue') main.append(renderQueue());
  else if(view==='installer-trucks'||view==='sales-trucks') main.append(trucksPanel());
  if(openId) renderDrawer();
}

function matches(d){
  if(!search) return true;
  const q=search.toLowerCase();
  return [d.customer,d.soNo,d.address,d.items,d.phone].some(x=>(x||'').toLowerCase().includes(q));
}
function cardFor(d){
  const date = d.status==='requested' ? d.preferredDate : d.status==='proposed' ? d.proposedDate : d.date;
  const win  = d.status==='requested' ? d.preferredWindow : d.status==='proposed' ? d.proposedWindow : d.window;
  const lbl  = d.status==='requested' ? 'Wants: ' : d.status==='proposed' ? 'Proposed: ' : '';
  return h('div',{class:'card',style:'--sc:'+sc(d.status),onclick:()=>openDrawer(d.id)},
    h('div',{class:'t'},d.customer||'(no name)'),
    h('div',{class:'m'},[d.soNo, (d.address||'').slice(0,60)].filter(Boolean).join(' · ')),
    h('div',{class:'d'}, h('span',null,lbl+fmtD(date)), win?h('span',{class:'tag'},(WINDOWS[win]||'').split(' (')[0]):null,
      SCHEDULED.includes(d.status)||d.status==='proposed' ? h('span',{class:'tag'},truckName(d.truckId||d.proposedTruckId)) : null)
  );
}
function renderBoard(){
  const wrap=h('div');
  const t=todayStr();
  const needDate=deliveries.filter(d=>d.status==='requested').length;
  const waiting=deliveries.filter(d=>d.status==='proposed').length;
  const todays=deliveries.filter(d=>d.date===t && SCHEDULED.includes(d.status)).length;
  let over=0;
  for(let i=0;i<7;i++){ const day=addDays(mondayOf(t),i); (config.trucks||[]).forEach(tr=>{ if(tr.cap && bookedCount(day,tr.id)>Number(tr.cap)) over++; }); }
  wrap.append(h('div',{class:'kpis'},
    h('div',{class:'kpi'+(needDate?' warn':'')},h('b',null,needDate),h('span',null,'Requests needing a date')),
    h('div',{class:'kpi'},h('b',null,waiting),h('span',null,'New dates waiting on Sales')),
    h('div',{class:'kpi'},h('b',null,todays),h('span',null,"Today's deliveries")),
    h('div',{class:'kpi'+(over?' warn':'')},h('b',null,over),h('span',null,'Overbooked driver-days this week'))
  ));
  const s=h('input',{type:'search',placeholder:'Search customer, SO no., address, items…',value:search});
  s.addEventListener('input',()=>{search=s.value; const c=wrap.querySelector('.cols'); c.replaceWith(cols())});
  const cb=h('label',{style:'display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:600;font-size:12px'},
    h('input',{type:'checkbox',style:'width:auto',checked:showCancelled,onchange:e=>{showCancelled=e.target.checked;render()}}),'Show cancelled');
  wrap.append(h('div',{class:'toolbar'},s,cb));
  const cols=()=>{
    const c=h('div',{class:'cols',style:showCancelled?'grid-template-columns:repeat(7,minmax(200px,1fr))':''});
    const keys=showCancelled?[...BOARD_COLS,'cancelled']:BOARD_COLS;
    const cutoff=addDays(t,-14);
    keys.forEach(k=>{
      let list=deliveries.filter(d=>d.status===k && matches(d));
      if(k==='delivered') list=list.filter(d=>(d.date||'')>=cutoff);
      list.sort((a,b)=>((a.date||a.proposedDate||a.preferredDate||'')).localeCompare(b.date||b.proposedDate||b.preferredDate||''));
      c.append(h('div',{class:'col'},
        h('div',{class:'colh'},h('span',{class:'dot',style:'background:'+sc(k)}),k==='delivered'?'Delivered (14 days)':STATUS[k].label,h('span',{class:'n'},list.length)),
        list.length?list.map(cardFor):h('div',{class:'empty'},k==='requested'&&isSales()?'Nothing waiting. Tap "+ New delivery request" when a Sales Order is ready.':'Nothing here')
      ));
    });
    return c;
  };
  wrap.append(cols());
  if(!deliveries.length) wrap.append(h('div',{class:'infobox',style:'margin-top:12px;max-width:720px'},
    h('b',null,'How it works: '),'Sales creates a delivery request → Delivery confirms a date and driver (or proposes another date) → Sales accepts and tells the customer → the crew marks it Loaded, Out for delivery and Delivered.'));
  return wrap;
}

function renderCalendar(){
  const wrap=h('div');
  const days=[...Array(7)].map((_,i)=>addDays(weekStart,i));
  const t=todayStr();
  wrap.append(h('div',{class:'toolbar'},
    h('button',{class:'btn',onclick:()=>{weekStart=addDays(weekStart,-7);render()}},'‹ Prev week'),
    h('button',{class:'btn',onclick:()=>{weekStart=mondayOf(todayStr());render()}},'This week'),
    h('button',{class:'btn',onclick:()=>{weekStart=addDays(weekStart,7);render()}},'Next week ›'),
    h('b',{style:'margin-left:8px'},fmtD(days[0],{month:'long',day:'numeric'})+' – '+fmtD(days[6],{month:'long',day:'numeric',year:'numeric'}))
  ));
  const trucks=(config.trucks||[]).slice();
  const rows=[...trucks.map(tr=>({id:tr.id,name:tr.name,cap:Number(tr.cap)||0}))];
  const known=new Set(trucks.map(x=>x.id));
  if(deliveries.some(d=>SCHEDULED.includes(d.status)&&days.includes(d.date)&&!known.has(d.truckId||'__'))) rows.push({id:'__none',name:trucks.length?'No / removed driver':'All deliveries',cap:0});
  if(!rows.length) rows.push({id:'__none',name:'All deliveries',cap:0});
  const tbl=h('table',{class:'cal'});
  tbl.append(h('tr',null,h('th',{style:'width:130px'},'Driver'),days.map(d=>{
    const n=deliveries.filter(x=>x.date===d&&SCHEDULED.includes(x.status)).length;
    return h('th',{class:d===t?'today':''},fmtD(d,{weekday:'short'}),h('span',{class:'big'},parseD(d).getDate()),h('span',{style:'color:var(--muted);font-weight:600'},n+' deliver'+(n===1?'y':'ies')));
  })));
  rows.forEach(r=>{
    const tr=h('tr',null,h('td',{class:'rowh'},r.name,r.cap?h('small',null,'Max '+r.cap+' drops/day'):null));
    days.forEach(day=>{
      const list=deliveries.filter(d=>d.date===day&&SCHEDULED.includes(d.status)&&(r.id==='__none'?!known.has(d.truckId||'__'):d.truckId===r.id))
        .sort((a,b)=>(WIN_ORDER[a.window]??3)-(WIN_ORDER[b.window]??3));
      const over=r.cap&&list.length>r.cap, full=r.cap&&list.length>=r.cap;
      tr.append(h('td',{class:over?'over':''},
        r.cap?h('div',{class:'cap'+(full?' full':'')},list.length+' / '+r.cap+(over?' · OVERBOOKED':full?' · full':'')):null,
        list.map(d=>h('div',{class:'mini',style:'--sc:'+sc(d.status),onclick:()=>openDrawer(d.id)},h('b',null,d.customer),(WINDOWS[d.window]||'').split(' (')[0]+' · '+STATUS[d.status].short))
      ));
    });
    tbl.append(tr);
  });
  // pending requests row
  const pr=h('tr',null,h('td',{class:'rowh'},'Not yet confirmed',h('small',null,'Requested / proposed dates')));
  days.forEach(day=>{
    const list=deliveries.filter(d=>(d.status==='requested'&&d.preferredDate===day)||(d.status==='proposed'&&d.proposedDate===day));
    pr.append(h('td',null,list.map(d=>h('div',{class:'mini pending',style:'--sc:'+sc(d.status),onclick:()=>openDrawer(d.id)},h('b',null,d.customer),STATUS[d.status].short))));
  });
  tbl.append(pr);
  wrap.append(h('div',{class:'calwrap'},tbl));
  wrap.append(renderMonth());
  if(!trucks.length) wrap.insertBefore(h('div',{class:'infobox',style:'margin-top:12px;max-width:720px'},'Tip: add your drivers and how many drops each can do per day under ',h('a',{href:mode==='installer'?'#installer-trucks':'#sales-trucks'},'Drivers'),' — the calendar will then show one row per driver and warn you when a day is full.'), wrap.lastChild);
  return wrap;
}

function renderMonth(){
  const [y,m]=monthCursor.split('-').map(Number);
  const first=dstr(new Date(y,m-1,1));
  const start=mondayOf(first);
  const t=todayStr();
  const shift=n=>{ const d=new Date(y,m-1+n,1); monthCursor=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); };
  const box=h('div',{class:'month'});
  const sched=deliveries.filter(d=>SCHEDULED.includes(d.status)&&d.date);
  const pend=deliveries.filter(d=>(d.status==='requested'&&d.preferredDate)||(d.status==='proposed'&&d.proposedDate));
  const monthCount=sched.filter(d=>d.date.slice(0,7)===monthCursor).length;
  box.append(h('div',{class:'mhead'},
    h('h3',null,new Date(y,m-1,1).toLocaleDateString('en-PH',{month:'long',year:'numeric'})),
    h('button',{class:'btn sm',onclick:()=>shift(-1)},'‹ Prev month'),
    h('button',{class:'btn sm',onclick:()=>{monthCursor=t.slice(0,7);render()}},'This month'),
    h('button',{class:'btn sm',onclick:()=>shift(1)},'Next month ›'),
    h('span',{class:'spacer',style:'flex:1'}),
    h('span',{class:'kv',style:'margin:0'},monthCount+' scheduled deliver'+(monthCount===1?'y':'ies')+' this month · dashed = not yet confirmed')));
  const tbl=h('table',{class:'mcal'},h('tr',null,['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>h('th',null,d))));
  const lastDay=dstr(new Date(y,m,0));
  let day=start;
  for(let w=0;w<6;w++){
    if(w>0 && day>lastDay) break;
    const tr=h('tr');
    for(let k=0;k<7;k++){
      const dd=day;
      const inMonth=dd.slice(0,7)===monthCursor;
      const items=sched.filter(d=>d.date===dd).sort((a,b)=>(WIN_ORDER[a.window]??3)-(WIN_ORDER[b.window]??3));
      const pitems=pend.filter(d=>(d.status==='requested'?d.preferredDate:d.proposedDate)===dd);
      const all=[...items.map(d=>[d,false]),...pitems.map(d=>[d,true])];
      const shown=all.slice(0,4);
      const td=h('td',{class:(inMonth?'':'other')+(dd===t?' today':''),title:'Show this week above',
        onclick:()=>{ weekStart=mondayOf(dd); render(); window.scrollTo({top:0,behavior:'smooth'}); }},
        h('div',{class:'dn'},h('span',null,parseD(dd).getDate()),items.length?h('small',null,items.length+(items.length===1?' delivery':' deliveries')):null),
        shown.map(([d,isP])=>h('div',{class:'it'+(isP?' pending':''),style:'--sc:'+sc(d.status),title:d.customer+' — '+STATUS[d.status].short,
          onclick:e=>{e.stopPropagation();openDrawer(d.id)}},
          (isP?'':((WINDOWS[d.window]||'').split(' ')[0]+' · '))+d.customer)),
        all.length>4?h('div',{class:'more'},'+'+(all.length-4)+' more'):null);
      tr.append(td);
      day=addDays(day,1);
    }
    tbl.append(tr);
  }
  box.append(tbl);
  return box;
}

    const v=el.value;
    const cur={date:SCHEDULED.includes(d.status)?(d.date||''):'',window:SCHEDULED.includes(d.status)?(d.window||''):'',truckId:SCHEDULED.includes(d.status)?(d.truckId||''):''};

      } else {
        const ref=db.collection('deliveries').doc();
        await ref.set({...v,status:v.date?'confirmed':'requested',createdBy:me.id,createdAt:Date.now(),updatedAt:Date.now(),
          history:[{at:Date.now(),by:me.id,text:v.date?'Delivery scheduled for '+schedTxt:'Delivery added (not scheduled yet)'}]});
        toast(v.date?'Delivery scheduled':'Delivery saved — set its date when ready');
      }
    }});
}

// Reads the usual customer-details message:
// "650 - CC - Ada / Name: / Contact Number: / Complete Address: / Google Maps Pin Location: / Delivery Notes/Instructions: / <maps link>"
function parseDetails(text){
  const out={}; const notes=[];
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const urlRe=/https?:\/\/\S+/i;
  const labels=[
    ['customer',/^(customer\s*)?(full\s*)?name\s*[:\-]\s*(.*)$/i],
    ['phone',/^(contact\s*(number|no\.?|#)?|mobile(\s*number)?|phone(\s*number)?|cp\s*(no\.?)?)\s*[:\-]\s*(.*)$/i],
    ['address',/^((complete|delivery|full)\s*)?address\s*[:\-]\s*(.*)$/i],
    ['pin',/^(google\s*maps?\s*)?pin(\s*location)?\s*[:\-]\s*(.*)$/i],
    ['notes',/^(delivery\s*)?(notes?|instructions?)(\s*\/\s*instructions?)?\s*[:\-]\s*(.*)$/i],
  ];
  lines.forEach((line,idx)=>{
    const url=line.match(urlRe);
    for(const [key,re] of labels){
      const m=line.match(re);
      if(m){
        let val=(m[m.length-1]||'').trim();
        if(url && val.includes(url[0])){ out.mapLink=out.mapLink||url[0]; val=val.replace(url[0],'').trim(); }
        if(key==='pin'){ if(val) out.pin=val; }
        else if(key==='notes'){ if(val) notes.unshift(val); }
        else if(val) out[key]=val;
        return;
      }
    }
    if(url){ if(/maps|goo\.gl/i.test(url[0])) out.mapLink=out.mapLink||url[0]; return; }
    if(idx===0 && !line.includes(':')) out.soNo=line;
  });
  if(notes.length) out.notes=notes.join(' · ');
  return out;
}

function confirmForm(d,mode){
  const startDate = d.date || d.proposedDate || d.preferredDate || todayStr();
  const date=h('input',{type:'date',value:startDate});
  const win=winSelect(d.window||d.proposedWindow||d.preferredWindow);
  const truck=truckSelect(d.truckId||d.proposedTruckId);
  const note=h('input',{placeholder:mode==='reschedule'?'Reason for moving the date (shown to installers)':'Note (optional)'});
  const warn=h('div');
  const check=()=>{
    warn.replaceChildren();
    if(!truck.value) return;
    const cap=capOf(truck.value), n=bookedCount(date.value,truck.value,d.id);
    if(cap && n>=cap) warn.append(h('div',{class:'warnbox'},`${truckName(truck.value)} already has ${n} of ${cap} drops on ${fmtD(date.value)}. You can still confirm, but the day will be overbooked.`));
    else if(cap) warn.append(h('div',{class:'infobox'},`${truckName(truck.value)}: ${n} of ${cap} drops booked on ${fmtD(date.value)}.`));
  };
  date.addEventListener('change',check); truck.addEventListener('change',check); check();
  modal({title:mode==='reschedule'?'Reschedule delivery':'Set delivery schedule',saveLabel:mode==='reschedule'?'Save new schedule':'Save schedule',
    body:h('div',null,
      h('div',{class:'infobox'},'Delivery schedule for ',h('b',null,d.customer),'. The installers will see it on their route for that day.'),
      h('div',{class:'grid2'},F('Delivery date',date),F('Time window',win)),
      (config.trucks||[]).length?F('Driver',truck):h('div',{class:'infobox'},'No drivers set up yet — add them under Drivers to track capacity.'),
      warn,F('Note',note)),
    onSave:async(err)=>{
      if(!date.value){err.textContent='Pick a date.';return false}
      const patch={status:mode==='reschedule'&&d.status==='loaded'?'confirmed':'confirmed',date:date.value,window:win.value,truckId:truck.value||'',proposedDate:null,proposedWindow:null,proposedTruckId:null,proposedNote:null};
      const text=(mode==='reschedule'?'Rescheduled to ':'Scheduled for ')+fmtD(date.value)+' · '+WINDOWS[win.value].split(' (')[0]+(truck.value?' · '+truckName(truck.value):'')+(note.value.trim()?' — '+note.value.trim():'');
      await patchDelivery(d,patch,text); toast('Delivery scheduled');
    }});
}
function proposeForm(d){
  const date=h('input',{type:'date',value:d.preferredDate?addDays(d.preferredDate,1):todayStr()});
  const win=winSelect(d.preferredWindow);
  const truck=truckSelect('');
  const note=h('input',{placeholder:"e.g. Driver fully booked on the 22nd"});
  modal({title:'Propose another date',saveLabel:'Send proposal to Sales',
    body:h('div',null,h('div',{class:'infobox'},'Sales will see your proposed date, check with the customer, and accept or ask for another date.'),
      h('div',{class:'grid2'},F('Proposed date',date),F('Time window',win)),
      (config.trucks||[]).length?F('Driver',truck):null,F('Reason',note)),
    onSave:async(err)=>{
      if(!date.value){err.textContent='Pick a date.';return false}
      await patchDelivery(d,{status:'proposed',proposedDate:date.value,proposedWindow:win.value,proposedTruckId:truck.value||'',proposedNote:note.value.trim()},
        'Proposed '+fmtD(date.value)+' · '+WINDOWS[win.value].split(' (')[0]+(note.value.trim()?' — '+note.value.trim():''));
      toast('Proposal sent to Sales');
    }});
}
function acceptProposal(d){
  modal({title:'Accept proposed date?',saveLabel:'Yes, customer agreed',
    body:h('div',{class:'infobox'},'Confirm ',h('b',null,fmtLong(d.proposedDate)),' · ',WINDOWS[d.proposedWindow]||'',' for ',h('b',null,d.customer),'. Make sure the customer agreed to this date.'),
    onSave:async()=>{
      await patchDelivery(d,{status:'confirmed',date:d.proposedDate,window:d.proposedWindow||'day',truckId:d.proposedTruckId||'',proposedDate:null,proposedWindow:null,proposedTruckId:null,proposedNote:null},
        'Sales accepted '+fmtD(d.proposedDate)+' — confirmed');
      toast('Confirmed');
    }});
}
function salesRequestForm(d,mode){
  const date=h('input',{type:'date',value:d.preferredDate||todayStr()});
  const win=winSelect(d.preferredWindow,true);
  const note=h('input',{placeholder:"e.g. Customer is out of town until the 25th"});
  modal({title:mode==='counter'?'Ask for a different date':'Request a reschedule',saveLabel:'Send to installers',
    body:h('div',null,h('div',{class:'infobox'},'The delivery goes back to "Needs a date" and the installers confirms the new one.'),
      h('div',{class:'grid2'},F("Customer's new preferred date",date),F('Preferred time',win)),F('Reason',note)),
    onSave:async(err)=>{
      if(!date.value){err.textContent='Pick a date.';return false}
      await patchDelivery(d,{status:'requested',preferredDate:date.value,preferredWindow:win.value,date:null,window:null,proposedDate:null,proposedWindow:null,proposedTruckId:null,proposedNote:null},
        (mode==='counter'?'Customer declined the proposal; now wants ':'Reschedule requested; customer now wants ')+fmtD(date.value)+(note.value.trim()?' — '+note.value.trim():''));
      toast('Sent to the installers');
    }});
}
function deliveredForm(d){
  const rb=h('input',{placeholder:'Name of person who received the items'});
  const note=h('input',{placeholder:'Optional, e.g. installed and checked'});
  modal({title:d.install?'Mark as delivered & installed':'Mark as delivered',saveLabel:d.install?'Delivered & installed':'Delivered',
    body:h('div',null,F('Received by',rb),F('Note',note)),
    onSave:async(err)=>{
      if(!rb.value.trim()){err.textContent='Enter who received the items.';return false}
      await patchDelivery(d,{status:'delivered',receivedBy:rb.value.trim(),deliveredAt:Date.now()},(d.install?'Delivered & installed':'Delivered')+' — received by '+rb.value.trim()+(note.value.trim()?' — '+note.value.trim():''));
      toast('Marked delivered');
    }});
}
function failedForm(d){
  const note=h('input',{placeholder:'e.g. Nobody home, customer not answering'});
  modal({title:"Couldn't deliver",saveLabel:'Send back to schedule',kind:'dark',
    body:h('div',null,h('div',{class:'infobox'},'The delivery goes back to Sales as "Not scheduled" so they can talk to the customer and set a new date.'),F('What happened?',note)),
    onSave:async(err)=>{
      if(!note.value.trim()){err.textContent='Please say what happened.';return false}
      await patchDelivery(d,{status:'requested',date:null,window:null},"Couldn't deliver — "+note.value.trim());
      toast('Sent back for a new date');
    }});
}
function cancelForm(d){
  const note=h('input',{placeholder:'Reason'});
  modal({title:'Cancel this delivery?',saveLabel:'Cancel delivery',kind:'dark',cancelLabel:'Keep it',
    body:h('div',null,F('Reason',note)),
    onSave:async()=>{ await patchDelivery(d,{status:'cancelled'},'Cancelled'+(note.value.trim()?' — '+note.value.trim():'')); toast('Cancelled'); closeDrawer(); }});
}
function restoreForm(d){
  modal({title:'Restore this request?',saveLabel:'Restore',body:h('div',{class:'infobox'},'It goes back to "Needs a date".'),
    onSave:async()=>{ await patchDelivery(d,{status:'requested',date:null,window:null},'Request restored'); toast('Restored'); }});
}
function noteForm(d){
  const note=h('textarea',{placeholder:'Write a note for the other team'});
  modal({title:'Add note',saveLabel:'Add note',body:F('Note',note),
    onSave:async(err)=>{ if(!note.value.trim()){err.textContent='Write something first.';return false} await patchDelivery(d,{},''+note.value.trim()); }});
}
function messageModal(d){
  const ta=h('textarea',{style:'min-height:120px'}); ta.value=custMessage(d);
  modal({title:'Message for customer',body:h('div',null,h('div',{class:'infobox'},'Select the text and copy it into Messenger.'),ta),cancelLabel:'Close'});
  setTimeout(()=>ta.select(),50);
}

/* ---------- first-time role ---------- */
let asked=false;
function maybeAskRole(){
  if(mode!=='full'||isOwnerViewer||asked||!db||!me.id||me.role||!canWrite) return;
  asked=true;
  const bg=document.getElementById('modalbg'), m=document.getElementById('modal');
  const pick=async(role)=>{ try{ await db.doc('members/'+me.id).set({role,joinedAt:Date.now()}); bg.classList.remove('show'); toast('Welcome! You joined as '+ROLES[role]); location.hash=role==='sales'?'sales':'installer'; }catch(e){ err.textContent=errText(e);} };
  const err=h('div',{class:'err'});
  m.replaceChildren(h('div',{class:'mh'},'Welcome to Aldeco Deliveries'),
    h('div',{class:'mb'},h('p',{style:'margin:0 0 12px;color:var(--muted)'},'Which team are you on?'),
      h('div',{class:'rolepick'},
        h('button',{class:'rolecard',onclick:()=>pick('sales')},h('b',null,'Sales'),h('span',null,'I create delivery requests and talk to customers.')),
        h('button',{class:'rolecard',onclick:()=>pick('delivery')},h('b',null,'Installer'),h('span',null,'I deliver and install.'))),err),
    h('div',{class:'mf'}));
  bg.classList.add('show');
}
